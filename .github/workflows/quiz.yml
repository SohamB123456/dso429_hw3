name: hourly-quiz
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch questions and solve
        run: |
          curl -sfL -o /tmp/q.csv https://raw.githubusercontent.com/FaisalXL/dso429-hourly-quiz/main/questions.csv
          python3 solve.py /tmp/q.csv answers 49
      - name: Commit and push
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add answers
          git diff --cached --quiet || (git commit -m "Answer new rounds" && git push)
